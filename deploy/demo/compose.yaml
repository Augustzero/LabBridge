name: labbridge-demo

services:
  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: labbridge
      POSTGRES_USER: labbridge
      POSTGRES_PASSWORD: labbridge_demo_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labbridge -d labbridge"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  server:
    build:
      context: ../..
      dockerfile: deploy/demo/Dockerfile
      target: server-runtime
    environment:
      LABBRIDGE_DATABASE_URL: >-
        host=postgres port=5432 dbname=labbridge user=labbridge
        password=labbridge_demo_only connect_timeout=5
    depends_on:
      postgres:
        condition: service_healthy
    # 宿主机凭据文件 0640 属启动者主组，容器以补充组身份读取。
    group_add:
      - "${LABBRIDGE_DEMO_AUTH_GROUP:?run scripts/demo/run.sh first}"
    volumes:
      # Server 只读挂载管理 token 与节点密钥映射。
      - ${LABBRIDGE_DEMO_AUTH_DIR:?run scripts/demo/run.sh first}/management.token:/etc/labbridge/auth/management.token:ro
      - ${LABBRIDGE_DEMO_AUTH_DIR:?run scripts/demo/run.sh first}/agent-tokens.yaml:/etc/labbridge/auth/agent-tokens.yaml:ro
    # 健康检查贯通 HTTP listener、请求处理、认证与数据库连接；
    # 使用与 runner 一样的管理凭据。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          --header "Authorization: Bearer $$(cat /etc/labbridge/auth/management.token)"
          "http://127.0.0.1:18080/api/v1/nodes?limit=1"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports:
      - "127.0.0.1:${LABBRIDGE_SERVER_PORT:-18080}:18080"
    restart: unless-stopped

  agent:
    build:
      context: ../..
      dockerfile: deploy/demo/Dockerfile
      target: agent-runtime
    depends_on:
      server:
        condition: service_healthy
    group_add:
      - "${LABBRIDGE_DEMO_AUTH_GROUP:?run scripts/demo/run.sh first}"
    restart: unless-stopped
    volumes:
      - agent_state:/var/lib/labbridge
      # Agent 只能读取采集入口，不能从业务进程改写演示输入。
      - demo_inbox:/demo/inbox:ro
      # Agent 只拿到本节点密钥，看不到管理 token 和其他节点的映射。
      - ${LABBRIDGE_DEMO_AUTH_DIR:?run scripts/demo/run.sh first}/demo-node-001.token:/etc/labbridge/auth/agent.token:ro

  # Web 控制台与 Server 同源：前端只发相对路径请求，/api 经 Nginx 反代到 server:18080。
  web:
    build:
      context: ../..
      dockerfile: deploy/demo/Dockerfile.web
    depends_on:
      server:
        condition: service_healthy
    group_add:
      - "${LABBRIDGE_DEMO_AUTH_GROUP:?run scripts/demo/run.sh first}"
    volumes:
      # 健康检查走带管理 token 的节点查询，静态入口检查保持不变。
      - ${LABBRIDGE_DEMO_AUTH_DIR:?run scripts/demo/run.sh first}/management.token:/etc/labbridge/auth/management.token:ro
    # 健康检查同时覆盖静态入口与 /api 反代链路。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:8080/ &&
          wget -q -O /dev/null
          --header "Authorization: Bearer $$(cat /etc/labbridge/auth/management.token)"
          "http://127.0.0.1:8080/api/v1/nodes?limit=1"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports:
      - "127.0.0.1:${LABBRIDGE_WEB_PORT:-8080}:8080"
    restart: unless-stopped

  demo-runner:
    profiles: ["demo"]
    build:
      context: ../..
      dockerfile: deploy/demo/Dockerfile.runner
    environment:
      # runner 验证的是浏览器实际访问路径（Nginx 同源反代），不是直连 Server。
      DEMO_API_BASE_URL: http://web:8080/api/v1
      DEMO_NODE_CODE: demo-node-001
      DEMO_MANAGEMENT_TOKEN_FILE: /etc/labbridge/auth/management.token
      DEMO_TIMEOUT_SECONDS: ${LABBRIDGE_DEMO_TIMEOUT_SECONDS:-150}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: labbridge
      PGUSER: labbridge
      PGPASSWORD: labbridge_demo_only
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
      agent:
        condition: service_started
    group_add:
      - "${LABBRIDGE_DEMO_AUTH_GROUP:?run scripts/demo/run.sh first}"
    volumes:
      # runner 只在本次独立子目录写入 fixture 和结果索引。
      - demo_inbox:/demo/inbox
      # 工程回验只读 SQLite 与归档，普通演示不依赖这个挂载。
      - agent_state:/var/lib/labbridge:ro
      # runner 的全部管理 API 调用都带管理 token。
      - ${LABBRIDGE_DEMO_AUTH_DIR:?run scripts/demo/run.sh first}/management.token:/etc/labbridge/auth/management.token:ro
    restart: "no"

# 普通停止与再次启动均复用这些卷，不隐式清理历史状态。
volumes:
  postgres_data:
  agent_state:
  demo_inbox:
