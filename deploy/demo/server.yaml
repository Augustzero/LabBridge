listeners:
  - address: 0.0.0.0
    port: 18080
    https: false

app:
  number_of_threads: 1
  enable_session: false
  client_max_body_size: 1M
  # 与正式配置同口径：内存体上限不低于最大请求体，避免大报告触发
  # 请求体落盘转写（容器里转写目录不可写，会退化成 400 invalid JSON）。
  client_max_memory_body_size: 1M
  log:
    log_level: INFO
    display_local_time: false

custom_config:
  database:
    connection_info: "host=postgres port=5432 dbname=labbridge user=labbridge password=labbridge_demo_only connect_timeout=5"
  management:
    node_offline_after_seconds: 120
    task_run_stale_after_seconds: 3600
  storage:
    type: local
    root: /var/lib/labbridge/archive
  auth:
    management_token_file: /etc/labbridge/auth/management.token
    agent_tokens_file: /etc/labbridge/auth/agent-tokens.yaml

