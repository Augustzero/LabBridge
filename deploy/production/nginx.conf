# 正式环境 Web 控制台 Nginx 配置：非 root 运行，监听 8080。
# 浏览器和 Agent 都从这里进，/api 原样反代到 Server；
# Authorization 头按 Nginx 默认行为透传，代理层不改写、不补填凭据。
worker_processes auto;
error_log /dev/stderr warn;
# 非 root 运行时 /run 不可写，pid 放到 /tmp。
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    # 与 Server 的请求体上限对齐，manifest/report 也要走这条链路。
    client_max_body_size 1m;
    sendfile on;
    server_tokens off;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Compose 网络内 Server 可能随重启换 IP，用变量 + 内嵌 DNS
        # 让 nginx 在运行期重新解析，而不是启动时固定。
        location /api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream http://server:18080;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # SPA：非静态路径（如 /nodes、/runs 深链接）回退到入口 HTML。
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
