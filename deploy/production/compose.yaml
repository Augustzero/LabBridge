# 中心正式部署：PostgreSQL + Server + Web 三件套。
# 与 demo 的区别：只有 Web 对外暴露入口（默认只绑回环），Server 和
# PostgreSQL 都不发布宿主机端口；没有 demo runner，也没有自动示例任务。
# 所有秘密来自 --env-file 指向的仓库外环境文件（见 docs/operations/deployment.md）。
name: labbridge-center

services:
  postgres:
    image: ${LABBRIDGE_POSTGRES_IMAGE:-postgres:16.15-bookworm}
    environment:
      POSTGRES_DB: labbridge
      POSTGRES_USER: labbridge
      # 密码只放在仓库外的环境文件里，首次 initdb 生效后不再回读。
      POSTGRES_PASSWORD: ${LABBRIDGE_POSTGRES_PASSWORD:?set LABBRIDGE_POSTGRES_PASSWORD in the env file}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labbridge -d labbridge"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped
    volumes:
      # 中心唯一需要持久化的业务数据；stop、down、换镜像都不清这个卷。
      - postgres_data:/var/lib/postgresql/data
      # 只在空卷首次 initdb 时执行完整 schema，后续升级走 deploy/migrations 手工执行。
      - ../schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  server:
    # 镜像 tag 与导出产物对应；在线环境可由下方 build 现场构建。
    image: labbridge/server:${LABBRIDGE_IMAGE_TAG:?set LABBRIDGE_IMAGE_TAG in the env file}
    build:
      context: ../..
      dockerfile: deploy/demo/Dockerfile
      target: server-runtime
    environment:
      LABBRIDGE_DATABASE_URL: >-
        host=postgres port=5432 dbname=labbridge user=labbridge
        password=${LABBRIDGE_POSTGRES_PASSWORD:?set LABBRIDGE_POSTGRES_PASSWORD in the env file}
        connect_timeout=5
    depends_on:
      postgres:
        condition: service_healthy
    # 宿主机凭据文件 0640 属部署账户主组，容器以补充组身份读取。
    group_add:
      - "${LABBRIDGE_AUTH_GROUP:?set LABBRIDGE_AUTH_GROUP in the env file}"
    volumes:
      # 正式配置覆盖镜像内的 demo 配置；凭据逐文件只读挂载，Server 拿全套。
      - ./server.yaml:/etc/labbridge/server.yaml:ro
      - ${LABBRIDGE_AUTH_DIR:?set LABBRIDGE_AUTH_DIR in the env file}/management.token:/etc/labbridge/auth/management.token:ro
      - ${LABBRIDGE_AUTH_DIR:?set LABBRIDGE_AUTH_DIR in the env file}/agent-tokens.yaml:/etc/labbridge/auth/agent-tokens.yaml:ro
    # 健康检查贯通 HTTP listener、请求处理、认证与数据库连接，
    # 复用管理查询而不是另加空 health 接口。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          --header "Authorization: Bearer $$(cat /etc/labbridge/auth/management.token)"
          "http://127.0.0.1:18080/api/v1/nodes?limit=1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Web 控制台与 Server 同源：浏览器只发相对路径请求，/api 经 Nginx
  # 反代到 server:18080，Agent 的 server_url 也填这个入口。
  web:
    image: labbridge/web:${LABBRIDGE_IMAGE_TAG:?set LABBRIDGE_IMAGE_TAG in the env file}
    build:
      context: ../..
      dockerfile: deploy/demo/Dockerfile.web
    depends_on:
      server:
        condition: service_healthy
    group_add:
      - "${LABBRIDGE_AUTH_GROUP:?set LABBRIDGE_AUTH_GROUP in the env file}"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Web 只需要管理 token：健康检查要经 /api 反代打一次管理查询。
      - ${LABBRIDGE_AUTH_DIR:?set LABBRIDGE_AUTH_DIR in the env file}/management.token:/etc/labbridge/auth/management.token:ro
    # 健康检查同时覆盖静态入口与 /api 反代链路。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:8080/ &&
          wget -q -O /dev/null
          --header "Authorization: Bearer $$(cat /etc/labbridge/auth/management.token)"
          "http://127.0.0.1:8080/api/v1/nodes?limit=1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    # 默认只绑回环；Agent 或浏览器跨机器访问时在环境文件里改成中心内网地址。
    ports:
      - "${LABBRIDGE_WEB_BIND_ADDR:-127.0.0.1}:${LABBRIDGE_WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
