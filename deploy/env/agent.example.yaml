agent:
  node_code: lab-node-001
  name: default-lab-node
  server_url: http://127.0.0.1:18080
  request_timeout_seconds: 5
  heartbeat_interval_seconds: 15
  # 本节点访问控制面的密钥文件（必填）：内容为一个 64 位小写十六进制 token，
  # 与 Server 侧 agent-tokens.yaml 中本节点的密钥一致；相对路径相对本配置文件目录解析。
  token_file: /etc/labbridge/auth/agent-lab-node-001.token

storage:
  queue_db: ./data/agent_queue.db
  work_dir: ./data/work
  max_pending_jobs: 1000
  processed_fingerprint_capacity_per_task: 10000

delivery:
  retry_initial_seconds: 2
  retry_max_seconds: 300
  # 单个上报请求体上限（字节）：manifest/report 超限时作业转 requires_attention，
  # 不发送请求。必须不高于 Web/Server 链路里最小的请求体上限（当前默认 1 MiB）。
  max_request_body_bytes: 921600

tasks:
  poll_interval_seconds: 10
  # 单次运行最多采集的文件数：超出部分等下一个调度槽位，控制单轮请求体规模。
  max_files_per_run: 10
  allowed_local_roots:
    - /srv/labbridge/inbox

